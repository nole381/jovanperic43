                        <label class="form-check-label" for="zenski">Градски</label>

                <div class="col-md-4">

                <div class="col-md-4">
                    <label for="tezina" class="form-label">Број одиграних победа:</label>

                <div class="col-md-4">
                    <label for="slika" class="form-label">Грб клуба (лого):</label>

                <div class="col-12">
                    <label for="napomena" class="form-label">Историјат / Напомена о стручном штабу:</label>
                    <textarea id="napomena" name="napomena" class="form-control" rows="3" placeholder="Унесите додатне детаље о клубу, менаџеру..."></textarea>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success px-4">Сачувај клуб у базу</button>
                </div>

                        <select id="filterKategorija" class="form-select text-dark">

                            <option value="Pothranjenost">Борба за опстанак (<35%)</option>

                            <option value="Prekomerna težina">Лига Шампиона (55% - 70%)</option>

                            <option value="min-max">Успешност: Од мање ка већој</option>

                            <label for="editGodine" class="form-label">Година оснивања:</label>

                            <label class="form-label d-block">Стадион:</label>
                            <div class="form-check form-check-inline mt-2">

                                <input class="form-check-input" type="radio" name="pol" id="editZenski" value="Градски / Изнајмљен">
                                <label class="form-check-label" for="editZenski">Градски</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="editVisina" class="form-label">Број пораза:</label>
                            <input type="number" id="editVisina" name="visina" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label for="editTezina" class="form-label">Број победа:</label>

                        <div class="col-12">
                            <label for="editNapomena" class="form-label">Напомена:</label>
                            <textarea id="editNapomena" name="napomena" class="form-control" rows="3"></textarea>
